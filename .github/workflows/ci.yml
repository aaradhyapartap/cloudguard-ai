name: CI

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cloudguard
          POSTGRES_PASSWORD: cloudguard
          POSTGRES_DB: cloudguard
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cloudguard"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: cd backend && pip install -e ".[dev]" psycopg2-binary
      - name: Lint
        run: cd backend && ruff check .
      - name: Type check
        run: cd backend && mypy app
      - name: Migrate
        run: cd backend && alembic upgrade head
        env:
          DB_HOST: localhost

      # Seed the same organizations/users used by local development and
      # authenticated integration tests.
      - name: Seed database
        run: python scripts/seed_data.py
        env:
          DB_HOST: localhost

      # The POSTGRES_USER created by the service container is a privileged
      # database role. RLS must be tested through an ordinary application role,
      # otherwise PostgreSQL can bypass row-level policies.
      - name: Create application database role
        env:
          PGPASSWORD: cloudguard
        run: |
          psql -h localhost -U cloudguard -d cloudguard <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_roles WHERE rolname = 'cloudguard_app'
            ) THEN
              CREATE ROLE cloudguard_app
                LOGIN
                PASSWORD 'cloudguard_app'
                NOSUPERUSER
                NOCREATEDB
                NOCREATEROLE
                NOINHERIT
                NOBYPASSRLS;
            END IF;
          END
          $$;

          GRANT CONNECT ON DATABASE cloudguard TO cloudguard_app;
          GRANT USAGE ON SCHEMA public TO cloudguard_app;
          GRANT SELECT, INSERT, UPDATE, DELETE
            ON ALL TABLES IN SCHEMA public
            TO cloudguard_app;
          GRANT USAGE, SELECT
            ON ALL SEQUENCES IN SCHEMA public
            TO cloudguard_app;
          SQL

      # Isolation tests run against real PostgreSQL because Row-Level Security
      # does not exist in SQLite. They deliberately use the non-superuser role.
      - name: Test
        run: cd backend && pytest --cov=app --cov-report=term-missing
        env:
          DB_HOST: localhost
          DB_USER: cloudguard_app
          DB_PASSWORD: cloudguard_app
          RUN_DB_TESTS: '1'

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run typecheck
      - run: cd frontend && npm run build

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # gitleaks needs history to scan it
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Dependency audit (Python)
        run: pip install pip-audit && pip-audit -r <(cd backend && pip install -e . --dry-run --quiet 2>/dev/null; echo) || true
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Dependency audit (npm)
        run: cd frontend && npm audit --audit-level=high || true
