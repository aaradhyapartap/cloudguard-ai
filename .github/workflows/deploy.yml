name: Deploy

# ==============================================================================
# CloudGuard AI Protected Deployment Workflow
#
# Execution:
#   - Strictly manual trigger via workflow_dispatch.
#   - Keyless AWS authentication using GitHub Actions OIDC federation
#     (sts:AssumeRoleWithWebIdentity) into environment-scoped IAM roles.
#
# External Environment Protection Requirements:
#   - Environment protection rules (e.g. Required Reviewers, Deployment Branches,
#     Wait Timers) must be configured externally by repository administrators
#     in GitHub Settings > Environments for 'dev', 'staging', and 'prod'.
#   - Required environment variables:
#       - AWS_DEPLOY_ROLE_ARN: arn:aws:iam::<ACCOUNT_ID>:role/cloudguard-github-deploy-<env>
#       - AWS_REGION: (e.g. us-east-1)
#       - AWS_AURORA_CLUSTER_ARN: arn:aws:rds:...:cluster:...
#       - AWS_AURORA_SECRET_ARN: arn:aws:secretsmanager:...:secret:...
#       - (For prod): BEDROCK_GUARDRAIL_ID, BEDROCK_GUARDRAIL_VERSION
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      action:
        description: 'CDK action to execute'
        required: true
        default: 'diff'
        type: choice
        options:
          - diff
          - deploy
      stacks:
        description: 'Target stack names (comma- or space-separated; empty for all)'
        required: false
        default: ''
        type: string
      confirm_prod:
        description: 'Required token ("CONFIRM") if deploying to prod'
        required: false
        default: ''
        type: string

permissions:
  id-token: write  # Required for AWS OIDC federation
  contents: read   # Required to check out code
  actions: read    # Required to check CI run status
  checks: read     # Required to verify commit check runs

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  preflight-safety:
    name: Preflight Safety Gate
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Code
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Preflight Dependencies
        run: |
          pip install -r infrastructure/requirements.txt pytest

      - name: Validate Inputs and Production Protection
        env:
          TARGET_ENV: ${{ github.event.inputs.environment }}
          TARGET_ACTION: ${{ github.event.inputs.action }}
          CONFIRM_PROD: ${{ github.event.inputs.confirm_prod }}
        run: |
          set -euo pipefail
          # Validate environment
          if [[ "${TARGET_ENV}" != "dev" && "${TARGET_ENV}" != "staging" && "${TARGET_ENV}" != "prod" ]]; then
            echo "ERROR: Invalid environment '${TARGET_ENV}'. Allowed: dev, staging, prod." >&2
            exit 1
          fi

          # Validate action
          if [[ "${TARGET_ACTION}" != "diff" && "${TARGET_ACTION}" != "deploy" ]]; then
            echo "ERROR: Invalid action '${TARGET_ACTION}'. Allowed: diff, deploy." >&2
            exit 1
          fi

          # Production confirmation gate
          if [[ "${TARGET_ENV}" == "prod" && "${TARGET_ACTION}" == "deploy" ]]; then
            if [[ "${CONFIRM_PROD}" != "CONFIRM" ]]; then
              echo "ERROR: Deploying to prod requires confirm_prod to equal 'CONFIRM'." >&2
              exit 1
            fi
          fi

      - name: Require Successful CI on Exact Deployment Commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Verifying CI check-runs for commit ${COMMIT_SHA}..."
          python scripts/verify_deployment_ci.py \
            --commit-sha "${COMMIT_SHA}" \
            --repository "${{ github.repository }}"

      - name: Verify Out-of-VPC Lambda Architecture Boundary
        run: |
          # Verify that deployed Lambdas strictly have NO VpcConfig (ADR-0008)
          cd infrastructure
          python -m pytest tests/test_ingestion_stack.py -k test_lambda_function_exists_outside_vpc -ra

  cdk-action:
    name: CDK ${{ github.event.inputs.action }} (${{ github.event.inputs.environment }})
    needs: [preflight-safety]
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Check Out Code
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install CDK Dependencies
        run: |
          npm install -g aws-cdk
          pip install -r infrastructure/requirements.txt

      - name: Validate Environment-Specific Variables
        env:
          TARGET_ENV: ${{ github.event.inputs.environment }}
          TARGET_ACTION: ${{ github.event.inputs.action }}
          DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          AURORA_CLUSTER_ARN: ${{ vars.AWS_AURORA_CLUSTER_ARN }}
          AURORA_SECRET_ARN: ${{ vars.AWS_AURORA_SECRET_ARN }}
          GUARDRAIL_ID: ${{ vars.BEDROCK_GUARDRAIL_ID }}
          GUARDRAIL_VERSION: ${{ vars.BEDROCK_GUARDRAIL_VERSION }}
        run: |
          set -euo pipefail
          # Validate deploy role ARN before attempting assumption
          if [[ ! "${DEPLOY_ROLE_ARN:-}" =~ ^arn:aws:iam:[a-z0-9-]*:[0-9]{12}:role/cloudguard-github-deploy-${TARGET_ENV}$ ]]; then
            echo "ERROR: Missing or invalid AWS_DEPLOY_ROLE_ARN for environment '${TARGET_ENV}': '${DEPLOY_ROLE_ARN:-}'" >&2
            exit 1
          fi

          if [[ "${TARGET_ACTION}" == "deploy" ]]; then
            # Aurora ARNs are required for deploy in all environments
            if [[ ! "${AURORA_CLUSTER_ARN:-}" =~ ^arn:aws:rds:[a-z0-9-]+:[0-9]{12}:cluster:[a-zA-Z0-9_-]+$ ]]; then
              echo "ERROR: Missing or malformed AWS_AURORA_CLUSTER_ARN for environment '${TARGET_ENV}'." >&2
              exit 1
            fi
            if [[ ! "${AURORA_SECRET_ARN:-}" =~ ^arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[a-zA-Z0-9_/-]+$ ]]; then
              echo "ERROR: Missing or malformed AWS_AURORA_SECRET_ARN for environment '${TARGET_ENV}'." >&2
              exit 1
            fi

            # Production requires Bedrock Guardrail
            if [[ "${TARGET_ENV}" == "prod" ]]; then
              if [[ -z "${GUARDRAIL_ID:-}" || -z "${GUARDRAIL_VERSION:-}" ]]; then
                echo "ERROR: Production deployment requires BEDROCK_GUARDRAIL_ID and BEDROCK_GUARDRAIL_VERSION." >&2
                exit 1
              fi
            fi
          fi
          echo "Environment-specific variables successfully validated for environment '${TARGET_ENV}'."

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: CloudGuardDeploy-${{ github.event.inputs.environment }}-${{ github.run_id }}

      - name: Verify AWS Caller Identity
        run: aws sts get-caller-identity

      - name: Execute CDK Action
        env:
          TARGET_ENV: ${{ github.event.inputs.environment }}
          TARGET_ACTION: ${{ github.event.inputs.action }}
          INPUT_STACKS: ${{ github.event.inputs.stacks }}
          AURORA_CLUSTER_ARN: ${{ vars.AWS_AURORA_CLUSTER_ARN || '' }}
          AURORA_SECRET_ARN: ${{ vars.AWS_AURORA_SECRET_ARN || '' }}
          GUARDRAIL_ID: ${{ vars.BEDROCK_GUARDRAIL_ID || '' }}
          GUARDRAIL_VERSION: ${{ vars.BEDROCK_GUARDRAIL_VERSION || '' }}
        run: |
          set -euo pipefail
          cd infrastructure

          ALLOWED_STACKS=(
            "CloudGuardIdentity-${TARGET_ENV}"
            "CloudGuardRateLimits-${TARGET_ENV}"
            "CloudGuardIngestion-${TARGET_ENV}"
            "CloudGuardAgentWorkflow-${TARGET_ENV}"
            "CloudGuardObservability-${TARGET_ENV}"
            "CloudGuardOIDC-${TARGET_ENV}"
          )

          STACK_ARGS=()
          if [[ -n "${INPUT_STACKS}" ]]; then
            # Parse space- or comma-separated stack tokens
            for stack in ${INPUT_STACKS//,/ }; do
              # Prevent command or flag injection
              if [[ "${stack}" =~ ^- ]]; then
                echo "ERROR: Invalid stack argument: '${stack}'. Stack names cannot start with '-'." >&2
                exit 1
              fi
              # Validate against allowed stacks
              is_valid=0
              for allowed in "${ALLOWED_STACKS[@]}"; do
                if [[ "${stack}" == "${allowed}" ]]; then
                  is_valid=1
                  break
                fi
              done
              if [[ ${is_valid} -eq 0 ]]; then
                echo "ERROR: Stack '${stack}' is not recognized. Allowed stacks: ${ALLOWED_STACKS[*]}" >&2
                exit 1
              fi
              STACK_ARGS+=("${stack}")
            done
          fi

          # Context parameters matching app.py consumption
          CONTEXT_ARGS=(
            "--context" "env=${TARGET_ENV}"
            "--context" "environment=${TARGET_ENV}"
          )
          if [[ -n "${AURORA_CLUSTER_ARN}" ]]; then
            CONTEXT_ARGS+=("--context" "aurora_cluster_arn=${AURORA_CLUSTER_ARN}")
          fi
          if [[ -n "${AURORA_SECRET_ARN}" ]]; then
            CONTEXT_ARGS+=("--context" "aurora_secret_arn=${AURORA_SECRET_ARN}")
          fi
          if [[ -n "${GUARDRAIL_ID}" ]]; then
            CONTEXT_ARGS+=("--context" "bedrock_guardrail_id=${GUARDRAIL_ID}")
          fi
          if [[ -n "${GUARDRAIL_VERSION}" ]]; then
            CONTEXT_ARGS+=("--context" "bedrock_guardrail_version=${GUARDRAIL_VERSION}")
          fi

          if [[ "${TARGET_ACTION}" == "diff" ]]; then
            if [[ ${#STACK_ARGS[@]} -eq 0 ]]; then
              npx cdk diff "${CONTEXT_ARGS[@]}"
            else
              npx cdk diff "${STACK_ARGS[@]}" "${CONTEXT_ARGS[@]}"
            fi
          elif [[ "${TARGET_ACTION}" == "deploy" ]]; then
            if [[ ${#STACK_ARGS[@]} -eq 0 ]]; then
              npx cdk deploy --all --require-approval broadening "${CONTEXT_ARGS[@]}"
            else
              npx cdk deploy "${STACK_ARGS[@]}" --require-approval broadening "${CONTEXT_ARGS[@]}"
            fi
          fi
